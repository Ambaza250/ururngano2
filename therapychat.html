<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urungano Therapy Chat</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut,
      updateProfile,
    } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      collectionGroup,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      doc,
      setDoc,
      getDocs,
      getDoc,
      serverTimestamp,
      where,
      limit,
    } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyDy9ZCOQQIMnq6GOOnSS3Hk3IMSk06jTf4",
      authDomain: "urungano-chat-50d62.firebaseapp.com",
      projectId: "urungano-chat-50d62",
      storageBucket: "urungano-chat-50d62.firebasestorage.app",
      messagingSenderId: "730372170670",
      appId: "1:730372170670:web:91300da03f18f488afde3f",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentUserProfile = null;
    let currentTarget = null;
    let unsubscribeMessages = null;
    let isEnglish = false;
    const userCache = {};

    // Role + therapist selection
    // userRole: 'user' | 'therapist'
    let userRole = null;
    let therapistProfile = null; // therapist firestore doc when current user is therapist

    function t(rw, en) {
      return isEnglish ? en : rw;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text ?? "";
      return div.innerHTML;
    }

    function showSection(section) {
      document.getElementById("auth-section").style.display = section === "auth" ? "flex" : "none";
      document.getElementById("chat-section").style.display = section === "chat" ? "flex" : "none";
    }

    async function saveUserProfile(user, username = "") {
      const finalUsername = username || user.displayName || user.email?.split("@")[0] || "User";
      await setDoc(
        doc(db, "users", user.uid),
        {
          uid: user.uid,
          email: user.email || "",
          username: finalUsername,
          createdAt: serverTimestamp(),
        },
        { merge: true }
      );
      currentUserProfile = { uid: user.uid, username: finalUsername };
      userCache[user.uid] = currentUserProfile;
    }

    async function loadCurrentUserProfile(user) {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) {
        currentUserProfile = snap.data();
        userCache[user.uid] = currentUserProfile;
      } else {
        await saveUserProfile(user);
      }
    }

    async function loadTherapistProfileByUid(uid) {
      const snap = await getDoc(doc(db, "therapists", uid));
      if (!snap.exists()) return null;
      const data = snap.data();
      return data;
    }

    async function loadTherapistProfileByEmail(email) {
      // therapists collection docs are keyed by uid, so we query by email field.
      const q = query(collection(db, "therapists"), where("email", "==", email), limit(1));
      const snap = await getDocs(q);
      if (snap.empty) return null;
      const docSnap = snap.docs[0];
      return { ...(docSnap.data() || {}), uid: docSnap.id };
    }

    function setAuthModeUI(mode) {
      // mode: 'user' | 'therapist'
      // Hide/show username input: chat selection asks for therapist while logging in.
      const therapistPicker = document.getElementById("therapist-picker");
      const therapistEmail = document.getElementById("therapist-email");
      const therapistPickLabel = document.getElementById("therapist-pick-label");

      if (mode === "therapist") {
        therapistPicker.style.display = "block";
        therapistPickLabel.textContent = t("Hitamo umujyanama (therapist)", "Select your therapist");
        therapistEmail.placeholder = t(
          "Hitamo ukoresha: imeri y'umujyanama (email)",
          "Enter therapist email"
        );
      } else {
        therapistPicker.style.display = "none";
      }
    }

    // ===================== AUTH (UI) =====================
    window.signUp = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const username = document.getElementById("username").value.trim();
      const status = document.getElementById("status");

      if (!username || !email || !password) {
        status.innerHTML = `<span style="color:red;">${t("Nyuza amakuru yose", "Please fill all fields")}</span>`;
        return;
      }
      status.textContent = t("Tegereza...", "Please wait...");
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: username });
        await saveUserProfile(cred.user, username);
        status.innerHTML = `<span style="color:green;">${t("Iyandikishwa ryagenze neza!", "Sign up successful!")}</span>`;
      } catch (e) {
        status.innerHTML = `<span style="color:red;">${escapeHtml(e.message)}</span>`;
      }
    };

    window.logIn = async () => {
      document.getElementById("status").innerHTML = `<span style="color:#64748b;">${escapeHtml(t("Tegereza...", "Please wait..."))}</span>`;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const status = document.getElementById("status");

      if (!email || !password) {
        status.innerHTML = `<span style="color:red;">${t("Nyuza email n'ijambo ry'ibanga", "Enter email and password")}</span>`;
        return;
      }

      const mode = document.getElementById("login-mode").value; // user | therapist

      status.textContent = t("Tegereza...", "Please wait...");
      try {
        await signInWithEmailAndPassword(auth, email, password);

        // For therapist mode: ensure therapist picker email is provided, then store it in session
        if (mode === "therapist") {
          const therapistEmailInput = document.getElementById("therapist-email").value.trim();
          if (!therapistEmailInput) {
            status.innerHTML = `<span style="color:red;">${t(
              "Andika imeri y'umujyanama ugomba guhitamo",
              "Enter therapist email to select"
            )}</span>`;
            return;
          }
          sessionStorage.setItem("therapychat_selected_therapist_email", therapistEmailInput);
        } else {
          sessionStorage.removeItem("therapychat_selected_therapist_email");
        }

        status.innerHTML = `<span style="color:green;">${t("Kwinjira byagenze neza!", "Login successful!")}</span>`;
        // Move to chat UI (onAuthStateChanged will also handle section switching)
        showSection("chat");
      } catch (e) {
        status.innerHTML = `<span style="color:red;">${escapeHtml(e.message)}</span>`;
      }
    };

    function getLoginMode() {
      return document.getElementById("login-mode")?.value || "user";
    }

    // ===================== THERAPY CHAT RULES =====================
    // 1) When a user logs in, they can see ONLY therapists.
    // 2) When a therapist logs in, they can see ALL users who messaged them.

    async function getLatestBookingForUser(uid) {
  if (!uid) return null;
  const bookingRef = collection(db, "users", uid, "bookings");
  try {
    const q = query(bookingRef, orderBy("createdAt", "desc"), limit(1));
    const snap = await getDocs(q);
    if (!snap.empty) return { id: snap.docs[0].id, ...(snap.docs[0].data() || {}) };
  } catch (e) {
    console.warn("orderBy bookings failed, fallback", e);
    try {
      const snap = await getDocs(query(bookingRef, limit(20)));
      let best = null, bestMs = -1;
      snap.forEach((docSnap) => {
        const d = docSnap.data() || {};
        const raw = d.createdAt;
        let ms = 0;
        if (raw) {
          ms = raw.toMillis ? raw.toMillis() : new Date(raw).getTime();
          if (!Number.isFinite(ms)) ms = 0;
        }
        if (!best || ms > bestMs) {
          best = { id: docSnap.id, ...d };
          bestMs = ms;
        }
      });
      return best;
    } catch (e2) {
      console.error(e2);
      return null;
    }
  }
  return null;
}

function isBookingPaid(booking) {
  if (!booking) return false;
  const payment = booking.payment || {};
  return (
    booking.status === "confirmed" ||
    payment.confirmed === true ||
    booking.status === "pending"
  );
}

function showSidebarMessage(list, text) {
  list.innerHTML = "";
  const hint = document.createElement("div");
  hint.style.color = "#64748b";
  hint.style.marginTop = "10px";
  hint.style.fontSize = "14px";
  hint.style.lineHeight = "1.4";
  hint.textContent = text;
  list.appendChild(hint);
}

async function loadTherapistsForUserSidebar() {
  const list = document.getElementById("users-list");
  if (!list) return;
  list.innerHTML = `<p>${t("Tegereza...", "Loading...")}</p>`;

  try {
    const latest = await getLatestBookingForUser(currentUser?.uid);

    if (!latest || !latest.therapistUid) {
      showSidebarMessage(
        list,
        isEnglish
          ? "No booking found. Book a therapist first, then reopen this page."
          : "Nta booking yabonetse. Tegura umujyanama ubanze, hanyuma fungura iyi paji."
      );
      return;
    }

    if (!isBookingPaid(latest)) {
      showSidebarMessage(
        list,
        isEnglish
          ? "Your booking is not confirmed yet."
          : "Booking yawe ntiyemejwe."
      );
      return;
    }

    let displayName = latest.therapistName || latest.therapistUid;
    try {
      const prof = await loadTherapistProfileByUid(latest.therapistUid);
      if (prof?.username) displayName = prof.username;
      else if (prof?.email) displayName = prof.email;
    } catch (_) {}

    const therapist = { uid: latest.therapistUid, username: displayName };
    userCache[therapist.uid] = { uid: therapist.uid, username: therapist.username };

    list.innerHTML = "";
    const div = document.createElement("div");
    div.className = "user-item sidebar-item";
    div.dataset.type = "therapist";
    div.dataset.id = therapist.uid;
    div.innerHTML = `<strong>${escapeHtml(therapist.username || "Therapist")}</strong>`;
    div.onclick = () => openPrivateChat(therapist);
    list.appendChild(div);
  } catch (e) {
    console.error(e);
    showSidebarMessage(list, (isEnglish ? "Error: " : "Ikosa: ") + (e.message || String(e)));
  }
}

async function loadUsersWhoMessagedTherapistSidebar() {
  const list = document.getElementById("users-list");
  if (!list) return;
  list.innerHTML = `<p>${t("Tegereza...", "Loading...")}</p>`;

  const therapistUid = currentUser?.uid;
  if (!therapistUid) {
    showSidebarMessage(list, isEnglish ? "Not logged in." : "Ntiwinjiye.");
    return;
  }

  try {
    if (!therapistProfile?.uid) {
      const prof = await loadTherapistProfileByUid(therapistUid);
      if (prof) {
        therapistProfile = prof;
        userCache[therapistUid] = {
          uid: therapistUid,
          username: prof.username || prof.email || "Therapist",
          ...prof
        };
        currentUserProfile = userCache[therapistUid];
      }
    }

    const otherUidsSet = new Set();

    // Primary: therapists/{uid}/clients (no collection group needed)
    try {
      const clientsSnap = await getDocs(collection(db, "therapists", therapistUid, "clients"));
      clientsSnap.forEach((docSnap) => {
        const d = docSnap.data() || {};
        const uid = d.userUid || docSnap.id;
        if (uid && uid !== therapistUid) otherUidsSet.add(uid);
      });
    } catch (e) {
      console.warn("clients subcollection failed", e);
    }

    // Fallback: existing chats via messages (optional)
    try {
      const messagesSnap = await getDocs(query(collectionGroup(db, "messages")));
      messagesSnap.forEach((msgDoc) => {
        const segments = msgDoc.ref?.path?.split("/") || [];
        const chatsIdx = segments.lastIndexOf("chats");
        const messagesIdx = segments.lastIndexOf("messages");
        if (chatsIdx === -1 || messagesIdx !== chatsIdx + 2) return;
        const parts = segments[chatsIdx + 1].split("_");
        if (parts.length !== 2) return;
        if (parts[0] === therapistUid || parts[1] === therapistUid) {
          const other = parts[0] === therapistUid ? parts[1] : parts[0];
          if (other !== therapistUid) otherUidsSet.add(other);
        }
      });
    } catch (e) {
      console.warn("messages scan failed", e);
    }

    const otherUids = Array.from(otherUidsSet);
    if (otherUids.length === 0) {
      showSidebarMessage(
        list,
        isEnglish
          ? "No users have chosen you yet. (They must complete booking again after the latest update.)"
          : "Nta mukoresha uracyatoranyije. (Bagomba gusubira gukora booking nyuma y'ivugurura.)"
      );
      return;
    }

    list.innerHTML = "";
    const users = [];
    for (const uid of otherUids) {
      try {
        const snap = await getDoc(doc(db, "users", uid));
        const data = snap.exists() ? snap.data() : { uid, username: uid };
        userCache[uid] = { uid, ...data };
        users.push({ uid, username: data.username || data.email || "User", ...data });
      } catch (_) {
        users.push({ uid, username: uid });
      }
    }

    users.sort((a, b) => (a.username || "").localeCompare(b.username || ""));
    users.forEach((user) => {
      const div = document.createElement("div");
      div.className = "user-item sidebar-item";
      div.dataset.type = "user";
      div.dataset.id = user.uid;
      div.innerHTML = `<strong>${escapeHtml(user.username || "User")}</strong>`;
      div.onclick = () => openPrivateChat(user);
      list.appendChild(div);
    });
  } catch (e) {
    console.error(e);
    showSidebarMessage(list, (isEnglish ? "Error: " : "Ikosa: ") + (e.message || String(e)));
  }
}
    // ===================== GROUPS (Disabled in Therapy Chat) =====================
    // Therapy chat must be an exact replica of chat page, but behavior changes only.
    // We'll keep the groups section but disable loading and prevent selection.

    async function loadGroups() {
      const list = document.getElementById("groups-list");
      list.innerHTML = "";
      const p = document.createElement("p");
      p.textContent = t("Amatsinda ntabwo aboneka muri Therapy Chat", "Groups are disabled in Therapy Chat");
      list.appendChild(p);
    }

    function markActiveItem(type, id) {
      document.querySelectorAll(".sidebar-item").forEach((el) => {
        el.classList.toggle("active", el.dataset.type === type && el.dataset.id === id);
      });
    }

    function clearMessages() {
      document.getElementById("messages").innerHTML = "";
      if (unsubscribeMessages) unsubscribeMessages();
    }

    function openGroup(group) {
      // disabled
    }

async function openPrivateChat(otherUser) {
  // USER MODE: allow chat ONLY with the therapist they booked/paid for.
  if (userRole === "user") {
    const latest = await getLatestBookingForUser(currentUser?.uid);
    const paidTherapistUid = latest?.therapistUid;

    if (
      !paidTherapistUid ||
      otherUser?.uid !== paidTherapistUid ||
      !isBookingPaid(latest)
    ) {
      const container = document.getElementById("messages");
      container.innerHTML = `<div style="color:#b45309; padding:10px;">${
        isEnglish
          ? "You can only chat with your selected therapist."
          : "Ushobora kuganira n'umujyanama watoranijwe."
      }</div>`;
      return;
    }
  }

  currentTarget = { type: "private", data: otherUser };
  markActiveItem(
    otherUser.uid
      ? userRole === "therapist"
        ? "user"
        : "therapist"
      : "user",
    otherUser.uid
  );
  refreshHeader();
  clearMessages();

  const chatId = [currentUser.uid, otherUser.uid].sort().join("_");
  const q = query(
    collection(db, "chats", chatId, "messages"),
    orderBy("createdAt")
  );

  unsubscribeMessages = onSnapshot(
    q,
    renderMessages,
    (err) => {
      console.error("Therapy chat onSnapshot error:", err);
      const container = document.getElementById("messages");
      container.innerHTML = `<div style="color:red; padding:10px;">${
        isEnglish ? "Failed to load messages." : "Byanze gupakira ubutumwa."
      }</div>`;
    }
  );

  // Match chat.html behavior: switch to chat view immediately on mobile.
  updateMobileViews();
}

    function refreshHeader() {
      if (!currentTarget) return;
      const header = document.getElementById("chat-header");

      const other = currentTarget.data;
      const otherName = other.username || userCache[other.uid]?.username || "User";

      if (userRole === "therapist") {
        header.textContent = isEnglish ? `Chatting with ${otherName}` : `Kuganira na ${otherName}`;
      } else {
        header.textContent = isEnglish ? `Chatting with therapist: ${otherName}` : `Kuganira na umujyanama: ${otherName}`;
      }
    }

    function renderMessages(snapshot) {
      const container = document.getElementById("messages");
      container.innerHTML = "";

      snapshot.forEach((docSnap) => {
        const msg = docSnap.data();
        const time = msg.createdAt
          ? new Date(msg.createdAt.toDate()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          : "";

        const div = document.createElement("div");
        div.className = `message ${msg.senderId === currentUser.uid ? "sent" : "received"}`;

        const otherId = msg.senderId === currentUser.uid ? currentTarget.data.uid : msg.senderId;
        const otherName = userCache[otherId]?.username || "User";

        div.innerHTML = `
          ${msg.senderId !== currentUser.uid ? `<span class="sender-name">${escapeHtml(otherName)}</span>` : ""}
          <div>${escapeHtml(msg.text)}</div>
          <small>${time}</small>
        `;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    window.sendMessage = async () => {
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      if (!text || !currentTarget) return;

      const messageData = {
        text,
        senderId: currentUser.uid,
        senderName: currentUserProfile?.username || "User",
        createdAt: serverTimestamp(),
      };

      if (currentTarget.type === "private") {
        const chatId = [currentUser.uid, currentTarget.data.uid].sort().join("_");
        await addDoc(collection(db, "chats", chatId, "messages"), messageData);
      }

      input.value = "";
    };

    window.logout = () => signOut(auth);

    function isMobileViewport() {
      return window.matchMedia("(max-width: 900px)").matches;
    }

    function enterChatView() {
      if (!isMobileViewport()) return;
      const sidebar = document.querySelector(".sidebar");
      const chatArea = document.querySelector(".chat-area");
      if (sidebar) sidebar.style.display = "none";
      if (chatArea) chatArea.style.display = "flex";

      // Ensure messages area takes the correct space.
      const messages = document.getElementById("messages");
      if (messages) {
        messages.scrollTop = messages.scrollHeight;
      }

      const header = document.getElementById("chat-header");
      if (header) {
        const html = header.innerHTML;
        if (!html.includes('id="mobile-back-btn"')) {
          header.innerHTML = `
            <div style="display:flex; align-items:center; gap:10px; justify-content:flex-start;">
              <button id="mobile-back-btn" onclick="window.mobileBackToList()" style="background:#0f766e; padding:10px 16px; border-radius:30px; font-weight:700; border:none; cursor:pointer;">← ${t("Garuka", "Back")}</button>
              <span id="chat-header-title">${header.textContent}</span>
            </div>
          `;
        }
      }
    }


    function enterChatListView() {
      if (!isMobileViewport()) return;
      const sidebar = document.querySelector(".sidebar");
      const chatArea = document.querySelector(".chat-area");
      if (sidebar) sidebar.style.display = "block";
      if (chatArea) chatArea.style.display = "none";

      const header = document.getElementById("chat-header");
      if (header) {
        header.innerHTML = t(
          "Hitamo itsinda cyangwa umuntu ushaka kuganiramo",
          "Select a chat"
        );
      }
    }

    function updateMobileViews() {
      if (!isMobileViewport()) return;
      if (currentTarget) enterChatView();
      else enterChatListView();
    }

    window.mobileBackToList = () => {
      currentTarget = null;
      // clear visual active state (best-effort)
      try {
        if (typeof document !== 'undefined') {
          document.querySelectorAll('.sidebar-item').forEach(el => {
            el.classList.remove('active');
          });
        }
      } catch (e) {}
      clearMessages();
      enterChatListView();
    };

    function refreshLanguage() {
  const groupsTitle = document.getElementById("groups-title");
  if (groupsTitle) groupsTitle.textContent = t("Amatsinda", "Groups");

  const usersTitle = document.getElementById("users-title");
  if (usersTitle) {
    if (userRole === "therapist") {
      usersTitle.textContent = t("Abakoresha bagiye kugusanganira", "Users who chose you");
    } else {
      usersTitle.textContent = t("Umujyanama wawe", "Your therapist");
    }
  }

  const sendBtn = document.getElementById("send-btn");
  if (sendBtn) sendBtn.textContent = t("Ohereza", "Send");

  const messageInput = document.getElementById("message-input");
  if (messageInput) {
    messageInput.placeholder = t("Andika message hano...", "Type your message here...");
  }

  const langToggle = document.getElementById("lang-toggle");
  if (langToggle) {
    langToggle.textContent = isEnglish ? "Kinyarwanda | English" : "English | Kinyarwanda";
  }

  const logoutBtn = document.getElementById("logout-btn");
  if (logoutBtn) logoutBtn.textContent = t("Sohoka", "Logout");

  document.querySelectorAll(".back-btn").forEach((el) => {
    el.textContent = t("← Ahabanza", "← Back");
  });

  const header = document.getElementById("chat-header");
  if (header) {
    if (currentTarget) {
      refreshHeader();
    } else {
      header.textContent = t(
        "Hitamo itsinda cyangwa umuntu ushaka kuganiramo",
        "Select a chat or person to talk to"
      );
    }
  }
}

    async function initRoleAndSidebar(user) {
      currentUser = user;

      // Determine whether user is a therapist by checking therapists doc existence.
      const selectedMode = getLoginMode();

      const therapistByUid = await loadTherapistProfileByUid(user.uid);
      if (selectedMode === "therapist") {
        // Must choose which therapist they are while logging in.
        const chosenEmail = sessionStorage.getItem("therapychat_selected_therapist_email") || "";
        if (!chosenEmail) {
          throw new Error("Therapist selection email missing.");
        }

        // Enforce: chosen therapist must match currently signed-in user OR match therapist profile.
        // Since therapist can log in with their own auth account, we use chosen email to ensure correct profile.
        // If chosen email doesn't correspond to a therapist doc, deny.
        const selectedTherapistProfile = await loadTherapistProfileByEmail(chosenEmail);
        if (!selectedTherapistProfile) {
          throw new Error("Selected therapist not found.");
        }

        // If signed-in user.uid differs from selected therapist uid, prevent cross-therapist access.
        if (selectedTherapistProfile.uid !== user.uid) {
          throw new Error("Selected therapist email does not match your login.");
        }

        userRole = "therapist";
        therapistProfile = selectedTherapistProfile;
        userCache[user.uid] = { uid: user.uid, username: therapistProfile.username || therapistProfile.email || "Therapist" };
        currentUserProfile = userCache[user.uid];
        return;
      }

      // User mode.
      // If they accidentally try to login as user but their uid is in therapists, still treat them as therapist? Spec says therapists can login by choosing.
      // We'll respect selectionMode only. If selectedMode=user and user is therapist, show error.
      if (therapistByUid) {
        userRole = "user";
        // keep going for now, but we must ensure sidebar shows therapists (but for a therapist signed in in user mode is weird). We'll block.
        throw new Error("Your account is a therapist. Select therapist mode to login as therapy provider.");
      }

      userRole = "user";
      await loadCurrentUserProfile(user);
    }

    // ===================== INIT =====================
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          // Ensure role + profile
          await initRoleAndSidebar(user);

          showSection("chat");
          await loadGroups();

          // Sidebar behavior per requirements
          document.getElementById("users-title").style.display = "block";

          if (userRole === "user") {
            await loadTherapistsForUserSidebar();
          } else if (userRole === "therapist") {
            await loadUsersWhoMessagedTherapistSidebar();
          }

          refreshLanguage();
        } catch (e) {
          console.error(e);
          document.getElementById("status").innerHTML = `<span style="color:red;">${escapeHtml(e?.message || String(e))}</span>`;
          showSection("auth");
        }
      } else {
        showSection("auth");
      }
    });

    window.onload = () => {
      // default login mode is user
      const mode = getLoginMode();
      setAuthModeUI(mode);
      refreshLanguage();
    };
  </script>

  <script>
    // Keep auth-mode picker UI in sync with JS function inside module scope.
    (function () {
      const modeSelect = document.getElementById('login-mode');
      const apply = () => {
        const mode = modeSelect ? modeSelect.value : 'user';
        // The module defines setAuthModeUI; call it if present.
        if (typeof window.setAuthModeUI === 'function') {
          window.setAuthModeUI(mode);
        } else {
          // Fallback: just show therapist picker when therapist mode.
          const picker = document.getElementById('therapist-picker');
          if (picker) picker.style.display = mode === 'therapist' ? 'block' : 'none';
        }
      };
      apply();
      if (modeSelect) modeSelect.addEventListener('change', apply);
    })();
