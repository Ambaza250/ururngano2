<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage account | Urungano</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="app-shell.css"><link rel="stylesheet" href="urungano-design.css">
</head>
<body class="bg-slate-50" data-lang="en">
  <main class="max-w-xl mx-auto px-5 py-10">
    <section class="bg-white rounded-3xl shadow-lg border border-slate-100 p-6 sm:p-8">
      <p class="text-sm font-semibold text-teal-700">Urungano</p>
      <h1 class="text-2xl font-bold text-slate-900 mt-2" data-en="Manage account information" data-rw="Hindura amakuru ya konti">Manage account information</h1>
      <p id="account-email" class="text-sm text-slate-500 mt-2"></p>
      <form id="account-form" class="mt-7 space-y-5">
        <label class="block text-sm font-semibold text-slate-700"><span data-en="Username" data-rw="Izina ukoresha">Username</span><input id="username" required maxlength="80" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 font-normal" autocomplete="nickname"></label>
        <div class="border-t border-slate-100 pt-5">
          <h2 class="font-semibold text-slate-800" data-en="Change password" data-rw="Hindura ijambo ry'ibanga">Change password</h2>
          <p class="text-xs text-slate-500 mt-1" data-en="Enter your current password to confirm this change." data-rw="Andika ijambo ry'ibanga ukoresha ubu kugira ngo wemeze iri hinduka.">Enter your current password to confirm this change.</p>
          <label class="block text-sm font-semibold text-slate-700 mt-4"><span data-en="Current password" data-rw="Ijambo ry'ibanga ukoresha ubu">Current password</span><input id="current-password" type="password" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 font-normal" autocomplete="current-password"></label>
          <label class="block text-sm font-semibold text-slate-700 mt-4"><span data-en="New password" data-rw="Ijambo ry'ibanga rishya">New password</span><input id="new-password" type="password" minlength="6" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 font-normal" autocomplete="new-password"></label>
        </div>
        <p id="account-status" role="status" class="text-sm min-h-5"></p>
        <button class="w-full rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-semibold py-3" data-en="Save changes" data-rw="Bika impinduka">Save changes</button>
      </form>
    </section>
  </main>
  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, updateProfile, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from 'https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js';
    import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js';
    const config = { apiKey:'AIzaSyDy9ZCOQQIMnq6GOOnSS3Hk3IMSk06jTf4', authDomain:'urungano-chat-50d62.firebaseapp.com', projectId:'urungano-chat-50d62', storageBucket:'urungano-chat-50d62.firebasestorage.app', messagingSenderId:'730372170670', appId:'1:730372170670:web:91300da03f18f488afde3f' };
    const app = getApps()[0] || initializeApp(config), auth = getAuth(app), db = getFirestore(app);
    const form = document.getElementById('account-form'), status = document.getElementById('account-status');
    let user;
    onAuthStateChanged(auth, current => { user = current; if (!current) return location.replace('auth.html'); document.getElementById('username').value = current.displayName || ''; document.getElementById('account-email').textContent = current.email || ''; });
    form.addEventListener('submit', async event => {
      event.preventDefault(); if (!user) return;
      const username = document.getElementById('username').value.trim(), currentPassword = document.getElementById('current-password').value, newPassword = document.getElementById('new-password').value;
      if (!username) { status.textContent = 'Please enter a username.'; status.className = 'text-sm min-h-5 text-red-600'; return; }
      if (!!currentPassword !== !!newPassword) { status.textContent = 'Enter both your current and new password.'; status.className = 'text-sm min-h-5 text-red-600'; return; }
      if (newPassword && newPassword.length < 6) { status.textContent = 'New password must be at least 6 characters.'; status.className = 'text-sm min-h-5 text-red-600'; return; }
      const submit = form.querySelector('button[type="submit"],button:not([type])'); submit.disabled = true;
      try {
        await updateProfile(user, { displayName: username });
        await setDoc(doc(db, 'users', user.uid), { username }, { merge: true });
        if (newPassword) { const credential = EmailAuthProvider.credential(user.email, currentPassword); await reauthenticateWithCredential(user, credential); await updatePassword(user, newPassword); }
        document.getElementById('current-password').value = ''; document.getElementById('new-password').value = '';
        status.textContent = 'Account information saved.'; status.className = 'text-sm min-h-5 text-green-700';
      } catch (error) { status.textContent = error.code === 'auth/wrong-password' ? 'Your current password is incorrect.' : (error.message || 'Could not save account changes.'); status.className = 'text-sm min-h-5 text-red-600'; }
      finally { submit.disabled = false; }
    });
  </script>
  <script src="app-shell.js"></script>
</body>
</html>
